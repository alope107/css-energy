<!doctype html><meta charset=utf-8>
<style>body{margin:0}
#s{position:absolute;left:20px;top:100px;width:200px;height:60px;overflow-x:scroll;container-type:scroll-state;scrollbar-width:none}
#c{width:5000px;height:50px;color:black}
@container scroll-state(scrolled: right){#c{color:red}}
@container scroll-state(scrolled: left){#c{color:blue}}
#s::scroll-button(right){content:">";position:fixed;left:500px;top:20px;width:40px;height:40px}
#s::scroll-button(left){content:"<";position:fixed;left:560px;top:20px;width:40px;height:40px}
</style>
<div id=s tabindex=0><div id=c>x</div></div>
