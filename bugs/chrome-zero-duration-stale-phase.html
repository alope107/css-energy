<!doctype html>
<meta charset="utf-8">
<title>A 0s triggered animation shows its end keyframe before the trigger fires</title>
<style>
  body { font: 14px/1.4 sans-serif; margin: 16px; }
  @keyframes k { from { background: green; } to { background: red; } }
  .box { width: 300px; height: 30px; margin: 6px 0; color: white; padding: 0 6px; }
  /* --never names no trigger, so each animation waits for its trigger forever */
  #a { animation: k 0s both; animation-trigger: --never play; }
  #b { animation: k 1ms both; animation-trigger: --never play; }   /* control: 1ms */
  #c { animation: k 0s 1000000s both; }                             /* control: a delayed 0s animation */
</style>
<p>All three boxes should be green (the from keyframe: none of the animations has started).</p>
<div class="box" id="a">0s, waiting for its trigger</div>
<div class="box" id="b">1ms, waiting for its trigger</div>
<div class="box" id="c">0s, delayed by 10^6 s</div>
<!--
Observed (Linux, 2026-10-18): Chrome 153.0.8010.12 headless, default flags and with
--disable-blink-features=CompositorTimelineTrigger: the first box red, the other two green. Playwright's Firefox 157
doesn't support animation-trigger (it runs all three: red, red, green).

Spec: animation-triggers-1 §5 (https://drafts.csswg.org/animation-triggers-1/#triggered-animations-concept) says
animation-trigger "allows the animation's start to be delayed until an appropriate trigger occurs" but doesn't
define what an animation shows while it waits. Chromium's own model puts a waiting animation in the before phase at
its start boundary (timing_calculations.cc:106-111, `paused_for_trigger`): the 1ms box, like a delayed animation
(third box), shows the from keyframe with backwards fill. The 0s one shows the to keyframe, the result of an earlier
sample that was never redone. So this is an inconsistency more than a spec violation here.

The same stale phase does violate web-animations-1 through the API (needs script, so not part of this page; run it in
the console):
  const a = document.body.animate([{background: 'green'}, {background: 'red'}], {duration: 0, fill: 'both'});
  a.pause(); a.reverse();   // Chrome 153: body red, a.effect.getComputedTiming().progress 1; Firefox 157: green, 0
Spec (https://drafts.csswg.org/web-animations-1/#animation-effect-phases-and-states): animation direction is
'"backwards" if the effect is associated with an animation and the associated animation's playback rate is less than
zero', and 'An animation effect is in the before phase if the animation effect's local time is not unresolved and
either of the following conditions are met: ... the animation direction is "backwards", the endpoint-inclusive active
interval flag is false, and the local time is equal to the before-active boundary time.' For a 0s effect at local
time 0 with a negative playback rate that is the before phase: progress 0, the from keyframe (green). A fresh
animation with playbackRate -1, paused at currentTime 0, does report progress 0.

Likely cause (same in 153 and on main 22b3b159): AnimationEffect::UpdateInheritedTime (animation_effect.cc:326-341)
recomputes timing only if `needs_update_ || last_update_time_ != inherited_time || last_is_idle_ != is_idle`. The
direction (sign of the playback rate) and `paused_for_trigger_` are inputs to CalculateTimings but not to that check,
and AnimationEffect::SetPausedForTrigger (animation_effect.cc:406-408) doesn't invalidate. A new triggered CSS
animation is paused and sampled at time 0 (the after phase, for 0s) before SetPausedForTrigger(true)
(css/css_animations.cc:2533-2538); reverse() keeps currentTime 0, so the cached after-phase result survives too.
-->
