<!doctype html>
<meta charset="utf-8">
<title>timeline-trigger misses a layout-only change on an otherwise idle page</title>
<style>
  body { font: 14px/1.4 sans-serif; margin: 16px; }
  @keyframes come-in { to { top: 20px; } }          /* moves the subject into the scrollport at 0.3s */
  @keyframes go-green { from, to { background: green; } }
  .sc { position: relative; height: 100px; width: 300px; margin: 6px 0; border: 1px solid; overflow: auto; }
  .spacer { height: 1000px; }
  .subj { position: absolute; top: 600px; left: 0; width: 20px; height: 20px; background: gray;
          animation: come-in 0.01s 0.3s forwards; timeline-trigger: --t view(); }
  .out { width: 300px; height: 30px; margin: 6px 0; background: red; color: white; padding: 0 6px;
         animation: go-green 1ms forwards; animation-trigger: --t play-forwards; }
</style>
<p>The bar should turn green after 0.3 s, when the gray square enters the scroller. Don't move the mouse or scroll:
any input that makes a new frame fires the trigger late.</p>
<div class="sc"><div class="spacer"></div><div class="subj"></div></div>
<div class="out">trigger fired</div>
<!--
Observed (Linux, 2026-10-18): Chrome 153.0.8010.12, default flags, headless and headed (Xvfb): red 1.5, 3 and 5 s
after load; it turns green at the next frame something else causes (here, taking a screenshot). Green with
--disable-blink-features=CompositorTimelineTrigger, and green with default flags when another main-thread animation
runs on the page (an infinite animation of a registered custom property, as in
chrome-timeline-trigger-overflow-hidden.html); an infinite compositor-only opacity animation doesn't help. The subject
is moved into the scrollport by a CSS animation of `top` (a layout change, no scroll); after it ends nothing else on
the page produces main frames. Playwright's Firefox 157 doesn't support timeline triggers.

Spec (animation-triggers-1, https://drafts.csswg.org/animation-triggers-1/#timeline-triggers, §3): "A timeline
trigger is a trigger which is activated when some timeline enters the trigger's activation range". The view timeline
did enter it (a view-timeline-driven animation on the same subject updates).

Likely cause (inference; same code in 153 and on main 22b3b159): with CompositorTimelineTrigger (status "stable") the
main thread stops evaluating the trigger once a cc::TimelineTrigger exists (core/animation/timeline_trigger.cc:63-69);
activation then reaches Blink only through TimelineTrigger::NotifyActivated (timeline_trigger.cc:231-245), and the
impl thread evaluates cc triggers only inside AnimationHost::TickAnimations (cc/animation/animation_host.cc:744-753),
i.e. while something is ticking. A layout change that moves the subject without scrolling doesn't make the impl
thread tick, so the activation isn't noticed until something else requests a frame.
-->
