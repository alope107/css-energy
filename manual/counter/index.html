<!DOCTYPE html>
<html lang="en">
  <head>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div class="run-capture">
      --frame-count to --cached-frame
    </div>
    <div class="cache-capture">
      freeze --cached-frame, disconnect from --frame-count
    </div>
    <div class="run-hoist">
      --cached-frame to --hoist-frame
    </div>
  </body>
</html>
