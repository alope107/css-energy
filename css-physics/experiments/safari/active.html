<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>:active through a drag over a grid</title>
<!--
  Does a grid stay :active while the mouse drags across its cells with the button down? (rigid3d.css grabs a body
  while #app:has(.gr:active); in Safari 26.6 :active was lost a move or two into the drag.) Each grid is a variant of
  the page's pointer grid (ui3d.css "Mouse input"); press on one and drag: it is green while :active.
  experiments/safari/active.js drags each through safaridriver and reads :active after every move.
-->
<style>
/* === Probe === */
body{margin:0;padding:16px;font:13px/1.4 ui-monospace,Menlo,monospace;background:#fff;timeline-scope:--pmx,--pmy}
.g{position:relative;width:300px;height:120px;margin:8px 0 18px;border:1px solid #888;display:flex;overflow:hidden;background:#ddd;
  user-select:none;-webkit-user-select:none}
.g:active{background:#1f8a3a}
.g>b{flex:1;display:flex;flex-direction:column}
.g>b>i{flex:1;display:block}
/* --- Variants --- */
/* B: hovered cell gets anchor-name (the page) */
#B>b>i:hover{anchor-name:--hovB}
/* C: B + containment on the columns (the page) */
#C>b{contain:layout size style}#C>b>i:hover{anchor-name:--hovC}
/* D: C + touch-action and cursor (the page) */
#D{touch-action:none;cursor:grab}#D:active{cursor:grabbing}#D>b{contain:layout size style}#D>b>i:hover{anchor-name:--hovD}
/* E: D + an anchored marker with view timelines (the page's .pm) */
#E{touch-action:none;cursor:grab}#E:active{cursor:grabbing}#E>b{contain:layout size style}#E>b>i:hover{anchor-name:--hovE}
#E .pm{position:absolute;width:0;height:0;pointer-events:none;left:anchor(center,50%);top:anchor(center,50%);position-anchor:--hovE;
  view-timeline:--pmx x,--pmy y}
/* F: an :has() on an ancestor that follows :active (the page: #app:has(.gr:active){--att:1}) */
#Fw:has(#F:active){outline:3px solid #1f8a3a}
/* G: the hovered cell changes colour (a restyle per move) */
#G>b>i:hover{background:#06c}
</style>
</head>
