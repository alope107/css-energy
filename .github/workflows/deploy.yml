# Deploy css-physics, js-minus-js and paint to Cloudflare Workers (static assets, no script). deploy/README.md explains
# the setup, the trust model and how agents use it. In short:
#   push to main      -> production deploy (https://<worker>.<subdomain>.workers.dev) of each project that changed
#   push to a branch  -> preview version (https://<branch>-<worker>.<subdomain>.workers.dev) of each project the
#                        branch changed
#   workflow_dispatch -> deploy the projects you name, from the branch you pick
# build runs repo code and has no secrets; deploy has the Cloudflare token and runs no repo code, only this file.
name: deploy

on:
  push:
    branches: ['**']
    paths:
      - css-physics/**
      - js-minus-js/**
      - paint/**
      - deploy/**
      - .github/workflows/deploy.yml
  workflow_dispatch:
    inputs:
      projects:
        description: 'Projects to deploy, space-separated, or "all"'
        default: all
      reset_dictionaries:
        description: 'paint: allow changed site/d/*.png bytes (blanks every visitor''s stored canvas)'
        type: boolean
        default: false

permissions: {}

concurrency:
  group: deploy-${{ github.ref }}
  # previews: the newest push wins; production: finish what started, then deploy the newest
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  plan:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      projects: ${{ steps.plan.outputs.projects }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
          INPUT_PROJECTS: ${{ inputs.projects }}
        run: |
          all="css-physics js-minus-js paint"
          if [ "$EVENT" = workflow_dispatch ]; then
            list=$INPUT_PROJECTS
            [ "$list" = all ] && list=$all
          else
            # main: what this push changed; a branch: everything it changed since leaving main
            if [ "$REF" = refs/heads/main ]; then base=$BEFORE; else base=$(git merge-base origin/main HEAD); fi
            if git cat-file -e "$base^{commit}" 2>/dev/null; then
              changed=$(git diff --name-only "$base" HEAD)
            else
              changed=deploy/   # new branch with no history in common, or a force push: deploy everything
            fi
            if grep -q -e '^deploy/' -e '^\.github/workflows/deploy\.yml$' <<<"$changed"; then
              list=$all
            else
              list=$(for p in $all; do if grep -q "^$p/" <<<"$changed"; then echo "$p"; fi; done)
            fi
          fi
          for p in $list; do
            case " $all " in *" $p "*) ;; *) echo "::error::unknown project '$p' (one of: $all)"; exit 1 ;; esac
          done
          # shellcheck disable=SC2086 # split the list
          echo "projects=$(printf '%s\n' $list | jq -Rc 'select(length > 0)' | jq -sc .)" >> "$GITHUB_OUTPUT"
          echo "deploying: ${list:-nothing}"

  build:
    needs: plan
    if: needs.plan.outputs.projects != '[]'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.plan.outputs.projects) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: deploy/assemble.sh "$PROJECT" site
        env:
          PROJECT: ${{ matrix.project }}
      # js-minus-js deploys the committed dist/ page; warn when it no longer matches the source (forgot `make dist`)
      - if: matrix.project == 'js-minus-js'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - if: matrix.project == 'js-minus-js'
        run: |
          pip install -q -r js-minus-js/requirements.txt
          make -s -C js-minus-js dist
          git diff --quiet -- js-minus-js/dist ||
            echo "::warning title=js-minus-js::dist/js_in_css.xhtml is stale: make page && make l5-smoke, then make dist and commit. Deployed the committed one."
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site-${{ matrix.project }}
          path: site/
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: [plan, build]
    runs-on: ubuntu-24.04
    permissions: {}
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.plan.outputs.projects) }}
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
      url: ${{ steps.deploy.outputs.url }}
    env:
      PROJECT: ${{ matrix.project }}
      # Worker names and the account's workers.dev subdomain (https://<worker>.<subdomain>.workers.dev); override with
      # repository variables if yours differ
      WORKER: >-
        ${{ matrix.project == 'paint' && (vars.WORKER_PAINT || 'paint')
          || matrix.project == 'js-minus-js' && (vars.WORKER_JS_MINUS_JS || 'js-minus-js')
          || (vars.WORKER_CSS_PHYSICS || 'css-physics') }}
      SUBDOMAIN: ${{ vars.WORKERS_DEV_SUBDOMAIN || 'auberon' }}
      BRANCH: ${{ github.ref_name }}
      PRODUCTION: ${{ github.ref == 'refs/heads/main' }}
      WRANGLER_VERSION: 4.146.0
      WRANGLER_SEND_METRICS: 'false'
    steps:
      # No checkout: nothing from the repo runs next to the token. The artifact is data.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site-${{ matrix.project }}
          path: site
      - name: Check the site
        env:
          RESET_DICTIONARIES: ${{ inputs.reset_dictionaries }}
        run: |
          fail() { echo "::error title=$PROJECT::$1"; exit 1; }
          [[ $BRANCH =~ ^[A-Za-z0-9._/-]+$ ]] || fail "branch name '$BRANCH' has characters this workflow won't pass to wrangler"
          # static assets only: the Worker's config is written below and has no script. These are Pages' ways in; a
          # Worker serves them as plain files, which is never intended either.
          for f in _worker.js _routes.json functions .assetsignore; do [ ! -e "site/$f" ] || fail "site/$f is not allowed"; done
          n=$(find site -type f | wc -l)
          [ "$n" -le 20000 ] || fail "$n files; Workers static assets allow 20,000 per version (free plan)"
          big=$(find site -type f -size +25M)
          [ -z "$big" ] || fail "over 25 MiB, the per-file limit: $big"
          # paint: visitors' browsers hold the production dictionaries; new bytes blank every stored canvas
          if [ "$PROJECT" = paint ] && [ "$RESET_DICTIONARIES" != true ]; then
            for f in site/d/*; do
              url="https://$WORKER.$SUBDOMAIN.workers.dev/d/${f##*/}"
              r=$(curl -sS --retry 3 -o live -w '%{http_code} %{content_type}' "$url" || true)
              case $r in
                "200 image/"*) cmp -s live "$f" || fail "${f#site/} differs from production ($url). Restore it; to reset everyone's canvas on purpose, run this workflow by hand with reset_dictionaries" ;;
                "404 "*) ;;   # not in production yet: nobody holds it
                *) fail "can't read $url ($r) to compare dictionaries; check WORKERS_DEV_SUBDOMAIN, or run this workflow by hand with reset_dictionaries" ;;
              esac
            done
          fi
          echo "$n files, $(du -sh site | cut -f1)"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - id: deploy
        name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.json
          # previews: wrangler names the alias after the branch (lowercased, other characters as '-', shortened with a
          # hash to fit the hostname), or skips it when it can't
          WRANGLER_CI_GENERATE_PREVIEW_ALIAS: 'true'
          WORKERS_CI_BRANCH: ${{ github.ref_name }}
        run: |
          fail() { echo "::error title=$PROJECT::$1"; exit 1; }
          site=$PWD/site
          cd "$RUNNER_TEMP"   # away from the artifact: wrangler reads its config and .env from where it runs
          npm install --prefix "$RUNNER_TEMP" --no-save --no-audit --no-fund --ignore-scripts "wrangler@$WRANGLER_VERSION" > /dev/null
          wrangler=$RUNNER_TEMP/node_modules/.bin/wrangler
          # The whole Worker: static assets, no script. Written here, never read from the repo.
          jq -n --arg name "$WORKER" --arg dir "$site" '{
            name: $name, compatibility_date: "2026-09-01", workers_dev: true, preview_urls: true,
            assets: {directory: $dir, html_handling: "auto-trailing-slash", not_found_handling: "none"}}' > wrangler.json
          host=$WORKER.$SUBDOMAIN.workers.dev
          if [ "$PRODUCTION" = true ]; then
            "$wrangler" deploy -c wrangler.json --tag "${GITHUB_SHA:0:12}" --message "$BRANCH ${GITHUB_SHA:0:12}"
            jq -e --arg u "https://$host" 'select(.type == "deploy") | .targets | index($u)' "$WRANGLER_OUTPUT_FILE_PATH" > /dev/null ||
              fail "wrangler didn't report $host; set WORKERS_DEV_SUBDOMAIN to the account's workers.dev subdomain"
            url=https://$host alias=
          else
            # a version that takes no traffic, at its own preview URLs (each its own origin: a paint preview never
            # overwrites production's dictionaries, but shares the site's 500 in Chrome: deploy/README.md)
            "$wrangler" versions upload -c wrangler.json --tag "${GITHUB_SHA:0:12}" --message "$BRANCH ${GITHUB_SHA:0:12}"
            url=$(jq -r 'select(.type == "version-upload") | .preview_url // empty' "$WRANGLER_OUTPUT_FILE_PATH")
            alias=$(jq -r 'select(.type == "version-upload") | .preview_alias_url // empty' "$WRANGLER_OUTPUT_FILE_PATH")
            [ -n "$url" ] || fail "no preview URL: turn on Preview URLs for $WORKER (Settings → Domains & Routes), or deploy main once"
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "alias=$alias" >> "$GITHUB_OUTPUT"
      - name: Check the deployment
        env:
          URL: ${{ steps.deploy.outputs.url }}
          ALIAS: ${{ steps.deploy.outputs.alias }}
          KIND: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
        run: |
          fail() { echo "::error title=$PROJECT::$1"; exit 1; }
          # the response headers each page depends on, as served by Cloudflare
          expect() {
            for _ in 1 2 3 4 5 6; do
              curl -sS -o /dev/null -D - "$URL$1" | tr -d '\r' | grep -qi "^$2: *$3" && return 0
              sleep 10
            done
            fail "$URL$1: no '$2: $3' header"
          }
          case $PROJECT in
            css-physics) expect / content-type text/html ;;
            js-minus-js) expect /js_in_css.xhtml content-type application/xhtml+xml ;;
            paint)       expect /c/0/d/0.png use-as-dictionary 'match="/c/0/r/\*"'
                         expect /c/0/r/0.png content-encoding dcz ;;
          esac
          # annotations: `gh run view` prints them, so agents get the links without the web UI
          echo "::notice title=$PROJECT $KIND::$URL${ALIAS:+ (latest on $BRANCH: $ALIAS)}"
          echo "- **$PROJECT** ($KIND): $URL${ALIAS:+, $ALIAS}" >> "$GITHUB_STEP_SUMMARY"
