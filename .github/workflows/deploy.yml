# Deploy css-physics, js-minus-js and paint to Cloudflare Pages (direct upload). deploy/README.md explains the setup,
# the trust model and how agents use it. In short:
#   push to main      -> production deploy of each project that changed
#   push to a branch  -> preview deploy (https://<branch>.<project>.pages.dev) of each project the branch changed
#   workflow_dispatch -> deploy the projects you name, from the branch you pick
# build runs repo code and has no secrets; deploy has the Cloudflare token and runs no repo code, only this file.
name: deploy

on:
  push:
    branches: ['**']
    paths:
      - css-physics/**
      - js-minus-js/**
      - paint/**
      - deploy/**
      - .github/workflows/deploy.yml
  workflow_dispatch:
    inputs:
      projects:
        description: 'Projects to deploy, space-separated, or "all"'
        default: all
      reset_dictionaries:
        description: 'paint: allow changed site/d/*.png bytes (blanks every visitor''s stored canvas)'
        type: boolean
        default: false

permissions: {}

concurrency:
  group: deploy-${{ github.ref }}
  # previews: the newest push wins; production: finish what started, then deploy the newest
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  plan:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      projects: ${{ steps.plan.outputs.projects }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
          INPUT_PROJECTS: ${{ inputs.projects }}
        run: |
          all="css-physics js-minus-js paint"
          if [ "$EVENT" = workflow_dispatch ]; then
            list=$INPUT_PROJECTS
            [ "$list" = all ] && list=$all
          else
            # main: what this push changed; a branch: everything it changed since leaving main
            if [ "$REF" = refs/heads/main ]; then base=$BEFORE; else base=$(git merge-base origin/main HEAD); fi
            if git cat-file -e "$base^{commit}" 2>/dev/null; then
              changed=$(git diff --name-only "$base" HEAD)
            else
              changed=deploy/   # new branch with no history in common, or a force push: deploy everything
            fi
            if grep -q -e '^deploy/' -e '^\.github/workflows/deploy\.yml$' <<<"$changed"; then
              list=$all
            else
              list=$(for p in $all; do if grep -q "^$p/" <<<"$changed"; then echo "$p"; fi; done)
            fi
          fi
          for p in $list; do
            case " $all " in *" $p "*) ;; *) echo "::error::unknown project '$p' (one of: $all)"; exit 1 ;; esac
          done
          # shellcheck disable=SC2086 # split the list
          echo "projects=$(printf '%s\n' $list | jq -Rc 'select(length > 0)' | jq -sc .)" >> "$GITHUB_OUTPUT"
          echo "deploying: ${list:-nothing}"

  build:
    needs: plan
    if: needs.plan.outputs.projects != '[]'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.plan.outputs.projects) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: deploy/assemble.sh "$PROJECT" site
        env:
          PROJECT: ${{ matrix.project }}
      # js-minus-js deploys the committed dist/ page; warn when it no longer matches the source (forgot `make dist`)
      - if: matrix.project == 'js-minus-js'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - if: matrix.project == 'js-minus-js'
        run: |
          pip install -q -r js-minus-js/requirements.txt
          make -s -C js-minus-js dist
          git diff --quiet -- js-minus-js/dist ||
            echo "::warning title=js-minus-js::dist/js_in_css.xhtml is stale: make page && make l5-smoke, then make dist and commit. Deployed the committed one."
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site-${{ matrix.project }}
          path: site/
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: [plan, build]
    runs-on: ubuntu-24.04
    permissions: {}
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.plan.outputs.projects) }}
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
      url: ${{ steps.deploy.outputs.deployment-url }}
    env:
      PROJECT: ${{ matrix.project }}
      # Cloudflare Pages project names; override with repository variables if yours differ
      PAGES_PROJECT: >-
        ${{ matrix.project == 'paint' && (vars.PAGES_PROJECT_PAINT || 'dictionary-paint')
          || matrix.project == 'js-minus-js' && (vars.PAGES_PROJECT_JS_MINUS_JS || 'js-minus-js')
          || (vars.PAGES_PROJECT_CSS_PHYSICS || 'css-physics') }}
      BRANCH: ${{ github.ref_name }}
    steps:
      # No checkout: nothing from the repo runs next to the token. The artifact is data.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site-${{ matrix.project }}
          path: site
      - name: Check the site
        env:
          RESET_DICTIONARIES: ${{ inputs.reset_dictionaries }}
        run: |
          fail() { echo "::error title=$PROJECT::$1"; exit 1; }
          [[ $BRANCH =~ ^[A-Za-z0-9._/-]+$ ]] || fail "branch name '$BRANCH' has characters this workflow won't pass to wrangler"
          # static hosting only: these would turn the deployment into a Worker
          for f in _worker.js _routes.json functions; do [ ! -e "site/$f" ] || fail "site/$f is not allowed"; done
          n=$(find site -type f | wc -l)
          [ "$n" -le 20000 ] || fail "$n files; Pages allows 20,000"
          big=$(find site -type f -size +25M)
          [ -z "$big" ] || fail "over 25 MiB, Pages' per-file limit: $big"
          # paint: visitors' browsers hold the production dictionaries; new bytes blank every stored canvas
          if [ "$PROJECT" = paint ] && [ "$RESET_DICTIONARIES" != true ]; then
            for f in site/d/*; do
              url="https://$PAGES_PROJECT.pages.dev/d/${f##*/}"
              r=$(curl -sS --retry 3 -o live -w '%{http_code} %{content_type}' "$url" || true)
              case $r in
                "200 image/"*) cmp -s live "$f" || fail "${f#site/} differs from production ($url). Restore it; to reset everyone's canvas on purpose, run this workflow by hand with reset_dictionaries" ;;
                "200 text/html"*) ;;   # not in production yet (Pages answers a missing file with index.html)
                *) fail "can't read $url ($r) to compare dictionaries; for a project's first deploy, run this workflow by hand with reset_dictionaries" ;;
              esac
            done
          fi
          echo "$n files, $(du -sh site | cut -f1)"
      - id: deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.146.0'
          packageManager: npm
          command: pages deploy site --project-name=${{ env.PAGES_PROJECT }} --branch=${{ env.BRANCH }} --commit-hash=${{ github.sha }}
      - name: Check the deployment
        env:
          URL: ${{ steps.deploy.outputs.deployment-url }}
          ALIAS: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
          PAGES_ENV: ${{ steps.deploy.outputs.pages-environment }}
          GH_ENV: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
        run: |
          fail() { echo "::error title=$PROJECT::$1"; exit 1; }
          [ "$PAGES_ENV" = "$GH_ENV" ] ||
            fail "Cloudflare made a $PAGES_ENV deployment from $BRANCH; set $PAGES_PROJECT's production branch to main"
          # the response headers each page depends on, as served by Cloudflare
          expect() {
            for _ in 1 2 3 4 5 6; do
              curl -sS -o /dev/null -D - "$URL$1" | tr -d '\r' | grep -qi "^$2: *$3" && return 0
              sleep 10
            done
            fail "$URL$1: no '$2: $3' header"
          }
          case $PROJECT in
            css-physics) expect / content-type text/html ;;
            js-minus-js) expect /js_in_css.xhtml content-type application/xhtml+xml ;;
            paint)       expect /c/0/d/0.png use-as-dictionary 'match="/c/0/r/\*"'
                         expect /c/0/r/0.png content-encoding dcz ;;
          esac
          # annotations: `gh run view` prints them, so agents get the links without the web UI
          echo "::notice title=$PROJECT $PAGES_ENV::$URL${ALIAS:+ (latest on $BRANCH: $ALIAS)}"
          echo "- **$PROJECT** ($PAGES_ENV): $URL${ALIAS:+, $ALIAS}" >> "$GITHUB_STEP_SUMMARY"
